<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>TJC Fees & Instalments</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* Layout: friendly school office app — logo bar with pill tabs, one working column, editor split into setup (left) and live fee breakdown (right); colours taken from the TJC badge (navy ring, red & blue blocks, cream centre) */
:root{
  --bg:#fbf6ee; --surface:#ffffff; --ink:#1b2a3d; --muted:#626e7d; --line:#ece2d2; --soft:#f6efe3;
  --navy:#1a3b5e; --navy-ink:#ffffff; --red:#d23f37; --blue:#2c6bb3; --sun:#f2b134;
  --t1:#e4eefb; --t1-ink:#24589a; --t2:#fbe6e4; --t2-ink:#b23830; --t3:#fdf1d6; --t3-ink:#8f5f06;
  --ok:#2e7d50; --ok-soft:#e1f2e7; --warn:#9a6205; --warn-soft:#fdf1d6;
  --f-display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111924; --surface:#18222f; --ink:#eef2f7; --muted:#9daabb; --line:#283546; --soft:#1e2a39;
  --navy:#8fbbec; --navy-ink:#0f1a26; --red:#f08a83; --blue:#8fbbec; --sun:#f5c05a;
  --t1:#1c3150; --t1-ink:#a9cbf3; --t2:#3d2224; --t2-ink:#f4a59f; --t3:#3a2f17; --t3-ink:#f3cd7c;
  --ok:#83d3a2; --ok-soft:#1b3326; --warn:#f3cd7c; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111924; --surface:#18222f; --ink:#eef2f7; --muted:#9daabb; --line:#283546; --soft:#1e2a39;
  --navy:#8fbbec; --navy-ink:#0f1a26; --red:#f08a83; --blue:#8fbbec; --sun:#f5c05a;
  --t1:#1c3150; --t1-ink:#a9cbf3; --t2:#3d2224; --t2-ink:#f4a59f; --t3:#3a2f17; --t3-ink:#f3cd7c;
  --ok:#83d3a2; --ok-soft:#1b3326; --warn:#f3cd7c; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px dashed var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:52px;height:52px;flex:none}
.brand b{display:block;font:800 21px/1 var(--f-display);color:var(--navy)}
.brand span{font-size:13px;color:var(--muted);font-weight:700}
#feeSheetBtn{margin-left:auto}#feeSheetBtn[hidden]+.yr{margin-left:auto}
.yr{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted)}
.yr select{width:auto;font-weight:800;color:var(--navy);padding:5px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.chip.paid{background:var(--ok-soft);color:var(--ok)}.chip.over{background:var(--t2);color:var(--t2-ink)}.chip.soon{background:var(--warn-soft);color:var(--warn)}.chip.up{background:var(--t1);color:var(--t1-ink)}
nav button{border:2px solid transparent;background:none;color:var(--muted);font:700 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button[aria-current="true"]{background:var(--navy);color:var(--navy-ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1{font:800 30px/1.15 var(--f-display);color:var(--navy);margin:28px 0 2px;text-wrap:balance}
h2{font:700 19px/1.25 var(--f-display);margin:0 0 10px}
h3{font:800 13px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot,var(--sun))}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.tile{border-radius:var(--r);padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.tile .n{font:800 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.tile.c1{background:var(--t1);border-color:transparent}.tile.c1 .n{color:var(--t1-ink)}
.tile.c2{background:var(--t2);border-color:transparent}.tile.c2 .n{color:var(--t2-ink)}
.tile.c3{background:var(--t3);border-color:transparent}.tile.c3 .n{color:var(--t3-ink)}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
.g-disc{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) auto;align-items:end;margin-bottom:8px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:8px}
.g-prog{grid-template-columns:minmax(0,3fr) minmax(0,1fr);margin-bottom:8px}
.g-dp{grid-template-columns:minmax(0,3fr) minmax(0,1fr) auto;align-items:end;margin-bottom:8px}
.g-term{grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));margin-bottom:10px}
.g-progx{grid-template-columns:minmax(0,.8fr) minmax(0,3fr) minmax(0,1.3fr) auto;align-items:end;margin-bottom:8px}
.cov{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:6px}
.cm{border-radius:10px;padding:6px 2px;text-align:center;background:var(--soft);color:var(--muted);font-size:11px;line-height:1.2;min-width:0}
.cm b{display:block;font-size:13px}.cm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm.k0{background:var(--t1);color:var(--t1-ink)}.cm.k1{background:var(--t2);color:var(--t2-ink)}.cm.k2{background:var(--t3);color:var(--t3-ink)}
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rm{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.rm.open{grid-column:1/-1;border-color:var(--navy)}
.rm-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.rm-h b{font-size:14px}
.rm-p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm .btn.ghost{align-self:flex-start;padding:2px 0;color:var(--blue)}
.cl{margin:0;padding-left:22px;display:grid;gap:6px}.cl li{padding-left:4px}.cl li b{display:block;font-size:14px}.cl li span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details summary::marker{color:var(--muted)}
.fi-list{display:grid;gap:12px}
.fi{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.fi-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.fi-top label.f{min-width:0}
.fi-mid{display:flex;flex-wrap:wrap;gap:12px 32px}
.fi-lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fi-ages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fi-parts{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.fi-part{display:flex;gap:8px;align-items:center}.fi-part>input{flex:1;min-width:0}
.lo{padding:6px 0;border-bottom:1px dashed var(--line)}.lo:last-of-type{border-bottom:0}
.lo-parts{margin:6px 0 4px 28px;display:grid;gap:4px}
.lo-p{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}.lo-p span:first-child{display:flex;gap:8px;align-items:center}
.lo-p select{width:auto;padding:3px 8px;font-size:13px}
.rep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:900px){.rep-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.rep-grid{grid-template-columns:minmax(0,1fr)}}
.rep{display:flex;flex-direction:column;gap:10px}.rep p{margin:0;flex:1}.rep .row{margin-top:auto}
code{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:6px}
@media (max-width:720px){.g-term,.g-progx{grid-template-columns:repeat(2,minmax(0,1fr))}.cov{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:520px){.fields,.g-disc,.g-3,.g-prog{grid-template-columns:minmax(0,1fr)}.g-disc{border-bottom:1px dashed var(--line);padding-bottom:10px}}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
input:disabled{background:var(--soft);color:var(--muted)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--navy)}
a.btn{text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:4px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.55;cursor:progress}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.blue{background:var(--t1);color:var(--t1-ink)}.chip.red{background:var(--t2);color:var(--t2-ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.term{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.term-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap;background:var(--tc);color:var(--tci)}
.term-h b{font:800 18px var(--f-display)}
.term-h small{font-weight:700}
.term.k0{--tc:var(--t1);--tci:var(--t1-ink)}.term.k1{--tc:var(--t2);--tci:var(--t2-ink)}.term.k2{--tc:var(--t3);--tci:var(--t3-ink)}
.lines{padding:8px 18px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.ln .lbl{min-width:0}
.ln .note{display:block;font-size:12px;color:var(--muted)}
.ln.disc .amt{color:var(--ok)}.ln.dep .lbl{color:var(--blue);font-weight:700}.ln.struck .amt{text-decoration:line-through;color:var(--muted)}
.ln.tot{border-top:2px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
.inst{border-top:1px solid var(--line);padding:12px 18px 16px;background:var(--soft)}
.inst table td{padding:5px 6px;border:0}
.inst input{padding:6px 9px}
.muted{color:var(--muted)}.small{font-size:13px}
.flash{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.note-box{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 18px}
.step{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.step.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step.now{border-color:var(--navy);color:var(--navy)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-size:13px;white-space:nowrap;min-width:110px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:700 13px var(--f-body);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.agree{font-size:14px;line-height:1.65;max-width:75ch}
.agree ol{padding-left:20px}
ol.agree{padding-left:20px;margin:0}ol.agree li{margin-bottom:6px}
.steps-list{margin:0;padding-left:20px;display:grid;gap:10px}.steps-list li span{display:block;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.tile,nav button{transition:background-color .15s,border-color .15s}}
</style>

  if(JSON.stringify(prev.principal)!==JSON.stringify(p.principal)&&p.principal.date)out.push('Principal signed '+fmtD(p.principal.date));
  if(JSON.stringify(prev.parentSign)!==JSON.stringify(p.parentSign)&&p.parentSign.date)out.push('Parent signed '+fmtD(p.parentSign.date));
  return out.join(' · ')||'Details updated';
}
function discOK(p){const c=p.calc||{};return (c.discounts||[]).some(d=>+d.pct||+d.amt)||!!c.noDiscount}
function needDisc(){if(discOK(draft))return false;flash('Choose a discount or tick “No discount” first');const el=document.getElementById('discPanel');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return true}
async function savePlan(quiet){
  if(!quiet&&draft.status!=='Requested'&&needDisc())return;
  const p=draft;p.id=p.id||('p'+uid());
  const prev=saved;const note=historyNote(prev,p);
  p.history=[...(p.history||[]),{at:new Date().toISOString(),what:note}];
  p.updated=new Date().toISOString();
  p.year=p.year||viewYear;const doc=clone(p);delete doc.mode;doc.year=p.year;
  try{const rq=p.requestId;delete doc.requestId;await api('savePlan',{plan:doc,requestId:rq||''});delete p.requestId;if(rq)requests=requests.filter(r=>r.id!==rq);const i=plans.findIndex(x=>x.id===doc.id);if(i>=0)plans[i]=clone(doc);else plans.push(clone(doc));saved=clone(doc);flash(quiet?'Marked paid':'Saved');if(quiet)render();else rerenderEditor()}catch(e){p.history.pop();if(e.code!=='wrong_pin')flash('Could not save: '+(e.message||e.code||'no connection'))}
}
async function saveCfg(c){
  const d=clone(c);d.year=viewYear;delete d.copiedFrom;configs[viewYear]=d;applyYear();
  try{await api('saveConfig',{year:viewYear,cfg:d});flash(viewYear+' settings saved');cfgDraft=clone(cfg);rerenderSettings()}catch(e){if(e.code!=='wrong_pin')flash('Could not save: '+(e.message||e.code||'no connection'))}
}
async function quickPaid(id,ti,k){const p=plans.find(x=>x.id===id);if(!p)return;draft=clone(p);saved=clone(p);draft.inst[ti].paid=draft.inst[ti].paid||[];draft.inst[ti].paid[k]=true;await savePlan(true)}

function docHead(title){const s=cfg.school;return `<div class="hd"><img src="${LOGO}" alt=""><div><h1>${esc(s.name)}</h1><small>${esc(s.company)}<br>${esc(s.address)}<br>${esc(s.phone)} · ${esc(s.email)}</small></div></div><div class="title">${title}</div>`}
const val=v=>v?`<span class="v">${esc(v)}</span>`:'';
const bx=(on,l)=>`<span class="opt"><span class="bx ${on?'on':''}"></span>${l}</span>`;
function breakdownBlock(p){
  const res=compute(cfg,p.calc);syncInst(cfg,p,res);const all=allInst(p);
  return res.terms.map(t=>`<h2>${esc(t.name)} (${t.range})${t.prorated?' · prorated '+fmtU(t.units)+' of '+t.tm:''}</h2><table>${t.lines.map(l=>`<tr><td>${esc(l.label)}${l.note?`<div class="tag">${esc(l.note)}</div>`:''}</td><td class="r" style="width:130px">${l.struck?'—':rm(l.amt)}</td></tr>`).join('')}<tr><th>Term total</th><th class="r">${rm(t.total)}</th></tr></table>`).join('')
  +`<h2>Payment schedule</h2><table><tr><th style="width:40px">No.</th><th>Term</th><th>Due date</th><th class="r">Amount</th></tr>${all.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(cfg.terms[i.ti].name)} (${i.k+1} of ${i.n})</td><td>${fmtD(i.due)}</td><td class="r">${rm(i.amt)}</td></tr>`).join('')}<tr><th colspan="3">Total payable for ${cfg.year}</th><th class="r">${rm(res.year)}</th></tr></table>`;
}

function quoteDoc(p){

function sums(list){const today=todayISO(),o={paid:0,over:0,soon:0,up:0,all:0};for(const i of list){o.all+=i.amt;o[instState(i,today)[0]]+=i.amt}for(const k in o)o[k]=r2(o[k]);return o}
const stTag=i=>{const[k,l]=instState(i);const col={paid:'#2e7d50',over:'#d23f37',soon:'#9a6205',up:'#24589a'}[k];return `<b style="color:${col}">${l}</b>`};
function sumTable(o){return `<table><tr><th>Paid</th><th>Unpaid · overdue</th><th>Due in 30 days</th><th>Upcoming</th><th>Total scheduled</th></tr><tr><td>${rm(o.paid)}</td><td>${rm(o.over)}</td><td>${rm(o.soon)}</td><td>${rm(o.up)}</td><td><b>${rm(o.all)}</b></td></tr></table>`}
function statementDoc(p){
  const res=compute(cfg,p.calc);syncInst(cfg,p,res);const all=allInst(p);
  return `<div class="doc">${docHead('Instalment Statement · '+viewYear)}<table><tr><td style="width:36%">Child</td><td class="v">${esc(p.child.name)}</td></tr><tr><td>Parent / guardian</td><td class="v">${esc(p.parent.name)}${p.parent.phone?' · '+esc(p.parent.phone):''}</td></tr><tr><td>Age group / programme</td><td class="v">${esc(p.calc.age)} · ${esc(progOf(cfg,p.calc.program).name)}</td></tr><tr><td>Plan period</td><td class="v">${fmtD(all[0]?.due)} to ${fmtD(all[all.length-1]?.due)}</td></tr></table>
  <h2>Summary as at ${fmtD(todayISO())}</h2>${sumTable(sums(all))}

  <p class="tag" style="margin-top:12px">As at ${fmtD(todayISO())}. ${esc(fillT(cfg.remarks.statement))}</p></div>`;
}
function monthlyDoc(ps){
  const today=todayISO(),ym=viewYear+'-'+pad(repMonth),mStart=ym+'-01',mEnd=iso(viewYear,repMonth,31),label=MON[repMonth-1]+' '+viewYear;
  const on=ps.filter(p=>{const a=allInst(p);return a.length&&a[0].due<=mEnd&&(a[a.length-1].due>=mStart||a.some(i=>!i.paid))});
  const rows=on.map(p=>{const a=allInst(p);const out=a.filter(i=>!i.paid&&i.due<=mEnd);return{p,a,out,outAmt:r2(out.reduce((x,i)=>x+i.amt,0)),dueM:a.filter(i=>i.due.startsWith(ym)),toCome:r2(a.filter(i=>i.due>mEnd).reduce((x,i)=>x+i.amt,0)),paid:a.filter(i=>i.paid)}});
  const allOut=rows.flatMap(r=>r.out.map(i=>({...i,p:r.p}))).sort((a,b)=>a.due<b.due?-1:1);
  const dueM=rows.flatMap(r=>r.dueM.map(i=>({...i,p:r.p}))).sort((a,b)=>a.due<b.due?-1:1);
  const T=(l,v)=>`<td style="text-align:center;padding:8px"><div style="font-size:15pt;font-weight:bold;color:#1a3b5e">${v}</div><div class="tag">${l}</div></td>`;
  const sumOut=r2(allOut.reduce((x,i)=>x+i.amt,0)),sumDue=r2(dueM.reduce((x,i)=>x+i.amt,0)),sumDuePaid=r2(dueM.filter(i=>i.paid).reduce((x,i)=>x+i.amt,0)),sumCome=r2(rows.reduce((x,r)=>x+r.toCome,0));
  return `<div class="doc">${docHead('Monthly Instalment Report · '+label)}<p class="tag" style="font-size:9pt">Covers children on an active instalment plan in ${label}. Outstanding means due on or before ${fmtD(mEnd)} and not marked paid. Prepared ${fmtD(today)}.</p>
  <table style="margin:6px 0 4px"><tr>${T('Children on instalment',rows.length)}${T('Outstanding as at '+fmtD(mEnd),rm(sumOut))}${T('Due in '+MON[repMonth-1],rm(sumDue))}${T('Of which paid',rm(sumDuePaid))}${T('Still to come after '+MON[repMonth-1],rm(sumCome))}</tr></table>
  <h2>Children currently on instalment</h2><table><tr><th>Child</th><th>Parent / mobile</th><th>Programme</th><th>Plan period</th><th class="r">Paid</th><th class="r">Outstanding</th><th>Next due</th></tr>${rows.map(r=>{const nx=r.a.find(i=>!i.paid);return `<tr><td><b>${esc(r.p.child.name)}</b><div class="tag">${esc(r.p.calc.age)}</div></td><td>${esc(r.p.parent.name)}<div class="tag">${esc(r.p.parent.phone)}</div></td><td>${esc(progOf(cfg,r.p.calc.program).name)}</td><td>${fmtD(r.a[0].due)} – ${fmtD(r.a[r.a.length-1].due)}</td><td class="r">${r.paid.length} / ${r.a.length}</td><td class="r">${r.outAmt?'<b style="color:#d23f37">'+rm(r.outAmt)+'</b>':rm(0)}</td><td>${nx?fmtD(nx.due)+'<div class="tag">'+rm(nx.amt)+'</div>':'All paid'}</td></tr>`}).join('')||'<tr><td colspan="7">No children on instalment this month.</td></tr>'}</table>
  <h2>Outstanding as at ${fmtD(mEnd)}</h2><table><tr><th>Due date</th><th>Child</th><th>Parent / mobile</th><th>Instalment</th><th class="r">Amount</th><th class="r">Days overdue</th></tr>${allOut.map(i=>`<tr><td>${fmtD(i.due)}</td><td><b>${esc(i.p.child.name)}</b></td><td>${esc(i.p.parent.name)}<div class="tag">${esc(i.p.parent.phone)}</div></td><td>${esc(cfg.terms[i.ti].name)} (${i.k+1}/${i.n})</td><td class="r">${rm(i.amt)}</td><td class="r">${Math.max(0,daysBetween(i.due,mEnd<today?mEnd:today))}</td></tr>`).join('')||'<tr><td colspan="6">Nothing outstanding.</td></tr>'}${allOut.length?`<tr><th colspan="4">Total outstanding</th><th class="r">${rm(sumOut)}</th><th></th></tr>`:''}</table>
  <h2>Due in ${label}</h2><table><tr><th>Due date</th><th>Child</th><th>Instalment</th><th class="r">Amount</th><th>Status</th></tr>${dueM.map(i=>`<tr><td>${fmtD(i.due)}</td><td><b>${esc(i.p.child.name)}</b></td><td>${esc(cfg.terms[i.ti].name)} (${i.k+1}/${i.n})</td><td class="r">${rm(i.amt)}</td><td>${stTag(i)}</td></tr>`).join('')||'<tr><td colspan="5">No instalments due this month.</td></tr>'}</table></div>`;
}
async function downloadExcel(btn){
  if(btn)btn.disabled=true;
  try{await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const list=[...yearPlans()].sort((a,b)=>(a.child.name||'').localeCompare(b.child.name||''));const today=todayISO();
    const recs=[],ins=[],hist=[],mon={};
    for(const p of list){const a=allInst(p),tot=compute(cfg,p.calc).year,out=a.filter(i=>!i.paid&&i.due<today);
      recs.push({'Child':p.child.name,'Parent':p.parent.name,'IC / passport':p.parent.ic,'Mobile':p.parent.phone,'Email':p.parent.email,'Age group':p.calc.age,'Programme':progOf(cfg,p.calc.program).name,'Status':shownStatus(p),'Request date':p.requestDate,'Start date':p.calc.enrolDate,'Discounts':(p.calc.discounts||[]).map(d=>d.label+(+d.pct?' '+d.pct+'%':' RM'+d.amt)).join(', ')||(p.calc.noDiscount?'None':''),'Year total (RM)':tot,'Instalments':a.length,'Paid':a.filter(i=>i.paid).length,'Paid (RM)':r2(a.filter(i=>i.paid).reduce((x,i)=>x+i.amt,0)),'Overdue (RM)':r2(out.reduce((x,i)=>x+i.amt,0)),'First due':a[0]?.due||'','Last due':a[a.length-1]?.due||'','Principal signed':p.principal?.date||'','Parent signed':p.parentSign?.date||'','Notes':p.notes||''});
      for(const i of a){ins.push({'Child':p.child.name,'Parent mobile':p.parent.phone,'Term':cfg.terms[i.ti]?.name||'','No.':i.k+1,'Of':i.n,'Due date':i.due,'Amount (RM)':i.amt,'Status':instState(i,today)[1]});
        const m=i.due.slice(0,7);mon[m]=mon[m]||{due:0,paid:0,unpaid:0,count:0};mon[m].due+=i.amt;mon[m][i.paid?'paid':'unpaid']+=i.amt;mon[m].count++}
      for(const h of (p.history||[]))hist.push({'Child':p.child.name,'Date & time':fmtDT(h.at),'Change':h.what});
    }
    const months=Object.keys(mon).sort().map(m=>({'Month':MON[+m.slice(5)-1]+' '+m.slice(0,4),'Instalments due':mon[m].count,'Due (RM)':r2(mon[m].due),'Paid (RM)':r2(mon[m].paid),'Not paid (RM)':r2(mon[m].unpaid)}));
    const wb=XLSX.utils.book_new(),add=(rows,name,empty)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{[empty]:'None yet'}]);const keys=Object.keys((rows[0]||{[empty]:''}));ws['!cols']=keys.map(k=>({wch:Math.min(40,Math.max(k.length+2,...rows.map(r=>String(r[k]??'').length+1)))}));XLSX.utils.book_append_sheet(wb,ws,name)};
    add(recs,'Records','Child');add(ins,'Instalments','Child');add(months,'By month','Month');add(hist,'History','Child');
    await saveFile('TJC Instalments '+viewYear+' as at '+today+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(e){flash('Could not make the Excel file')}finally{if(btn)btn.disabled=false}
}
function activePlans(){return yearPlans().filter(p=>p.status==='Active').sort((a,b)=>(a.child.name||'').localeCompare(b.child.name||''))}
function reportDoc(kind){
  const ps=activePlans(),today=todayISO();
  if(kind==='monthly')return monthlyDoc(ps);
  if(kind==='year'){
    const rows=ps.map(p=>{const a=allInst(p);return{p,a,s:sums(a),next:a.find(i=>!i.paid)}});
    const tot=sums(rows.flatMap(r=>r.a));
    return `<div class="doc">${docHead('Instalment Report · '+viewYear)}<p class="tag" style="font-size:9pt">As at ${fmtD(today)} · ${ps.length} child${ps.length===1?'':'ren'} on an active instalment plan</p>
    <h2>Summary</h2>${sumTable(tot)}
    <h2>By child</h2><table><tr><th>Child</th><th>Programme</th><th class="r">Paid</th><th class="r">Unpaid · overdue</th><th class="r">Still to come</th><th>Next due</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.p.child.name)}</b><div class="tag">${esc(r.p.parent.name)} ${esc(r.p.parent.phone)}</div></td><td>${esc(r.p.calc.age)} · ${esc(progOf(cfg,r.p.calc.program).name)}</td><td class="r">${rm(r.s.paid)}</td><td class="r">${rm(r.s.over)}</td><td class="r">${rm(r.s.soon+r.s.up)}</td><td>${r.next?fmtD(r.next.due):'All paid'}</td></tr>`).join('')||'<tr><td colspan="6">No active plans.</td></tr>'}</table>
    <h2>Instalment details</h2>${rows.map(r=>`<table style="margin-bottom:10px"><tr><th colspan="4">${esc(r.p.child.name)} · ${esc(progOf(cfg,r.p.calc.program).name)}</th></tr>${r.a.map(i=>`<tr><td style="width:34%">${esc(cfg.terms[i.ti].name)} (${i.k+1} of ${i.n})</td><td>${fmtD(i.due)}</td><td class="r">${rm(i.amt)}</td><td>${stTag(i)}</td></tr>`).join('')}</table>`).join('')}</div>`;
  }
  const items=ps.flatMap(p=>allInst(p).map(i=>({...i,p})));
  let list,title,sub;
  if(kind==='month'){const ym=viewYear+'-'+pad(repMonth);list=items.filter(i=>i.due.startsWith(ym));title='Instalments Due · '+MON[repMonth-1]+' '+viewYear;sub='All instalments with a due date in '+MON[repMonth-1]+' '+viewYear}
  else{list=items.filter(i=>!i.paid&&i.due<today);title='Unpaid & Overdue Instalments · '+viewYear;sub='Instalments past their due date and not marked paid, as at '+fmtD(today)}
  list.sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="doc">${docHead(title)}<p class="tag" style="font-size:9pt">${sub}</p>${sumTable(sums(list))}
  <h2>Details</h2><table><tr><th>Due date</th><th>Child</th><th>Parent / mobile</th><th>Instalment</th><th class="r">Amount</th><th>Status</th></tr>${list.map(i=>`<tr><td>${fmtD(i.due)}</td><td><b>${esc(i.p.child.name)}</b></td><td>${esc(i.p.parent.name)}<div class="tag">${esc(i.p.parent.phone)}</div></td><td>${esc(cfg.terms[i.ti].name)} (${i.k+1}/${i.n})</td><td class="r">${rm(i.amt)}</td><td>${stTag(i)}</td></tr>`).join('')||'<tr><td colspan="6">Nothing to show.</td></tr>'}</table></div>`;
}
function docFor(kind,p){return kind==='agree'?agreementDoc(p):kind==='form'?formDoc(p):kind==='statement'?statementDoc(p):quoteDoc(p)}
function docName(kind,p){const who=p&&p.child&&p.child.name?' - '+p.child.name.replace(/[^\w\s-]/g,'').trim():'';return ({agree:'TJC Instalment Agreement',form:'TJC Instalment Application Form',quote:'TJC Fee Breakdown',statement:'TJC Instalment Statement'}[kind])+' '+viewYear+(p?who:' (blank)')}
async function saveFile(filename,data){
  try{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);flash('Downloaded '+filename);return true}catch(e){flash('Could not download the file');return false}
}
async function makePDF(kind,p,btn){return pdfFrom(docFor(kind,p),docName(kind,p),btn)}
async function makeReport(kind,btn){const names={monthly:'TJC Monthly Instalment Report '+MON[repMonth-1]+' '+viewYear,year:'TJC Instalment Report '+viewYear,month:'TJC Instalments Due '+MON[repMonth-1]+' '+viewYear,overdue:'TJC Unpaid Instalments '+viewYear+' as at '+todayISO()};return pdfFrom(reportDoc(kind),names[kind],btn)}
async function pdfFrom(html,name,btn){
  if(!window.html2pdf){flash('The PDF maker didn’t load. Check your connection and reload.');return}
  if(btn){btn.disabled=true;var old=btn.textContent;btn.textContent='Making PDF…'}
  const sy=window.scrollY,sx=window.scrollX;window.scrollTo(0,0);
  const holder=document.createElement('div');holder.style.cssText='position:absolute;left:0;top:0;width:700px;background:#fff;z-index:-1';
  holder.innerHTML=`<style>${DOC_CSS}</style>`+html;document.body.appendChild(holder);
  try{
    const blob=await html2pdf().set({margin:[12,12,14,12],image:{type:'jpeg',quality:.96},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','.sig','h2']}}).from(holder.querySelector('.doc')).outputPdf('blob');
    await saveFile(name+'.pdf',blob);
  }catch(e){flash('Could not make the PDF')}
  finally{holder.remove();window.scrollTo(sx,sy);if(btn){btn.disabled=false;btn.textContent=old}}
}
function makeHTML(kind,p){return saveFile(docName(kind,p)+'.html',new Blob([`<!doctype html><html><head><meta charset="utf-8"><title>${esc(docName(kind,p))}</title><style>body{margin:32px auto;background:#fff}${DOC_CSS}@media print{body{margin:0}}</style></head><body>${docFor(kind,p)}</body></html>`],{type:'text/html'}))}

function setUp(t){upState=t;if(view==='edit')rerenderEditor()}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function handleUpload(file){
  if(!file||view!=='edit')return;
  if(file.size>15*1024*1024){setUp('That file is over 15 MB. Please upload a smaller PDF or photo.');return}
  setUp('Uploading '+file.name+'…');
  try{const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file)});
    const j=await api('upload',{name:(draft.child.name?draft.child.name+' - ':'')+file.name,type:file.type||'application/pdf',base64:b64});
    draft.form={id:j.id,url:j.url,name:file.name,type:file.type,at:new Date().toISOString()};
    let filled=false;
    if(/pdf/i.test(file.type||file.name)){try{const txt=new TextDecoder('latin1').decode(await file.arrayBuffer());const m=txt.match(/TJCDATA:([A-Za-z0-9+\/=]+)/);if(m){const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));applyParentData(d,new Date().toISOString());filled=true}}catch(e){}}
    const isNew=!draft.id;
    if(isNew){upState=filled?'Details filled in from the parent’s form and added to Instalment Records. Set up the fees next.':'Form saved and added to Instalment Records. Key in the child’s details, then Save.';await savePlan(true);rerenderEditor()}
    else setUp(filled?'Details filled in from the form. Check them, then Save.':'Form saved to Google Drive. Save the record to keep it.');
  }catch(e){if(e.code!=='wrong_pin')setUp('The file couldn’t be uploaded. Check your internet and try again.')}
}

    if(/^programs\.\d+\.code$/.test(d.c))rerenderSettings();
    return}
  if(d.age!==undefined){const i=+d.age,old=cfgDraft.ages[i],nw=el.value.trim();if(!nw||cfgDraft.ages.includes(nw)){el.value=old;return}cfgDraft.ages[i]=nw;for(const it of cfgDraft.items){it.amt=it.amt||{};if(old in it.amt){it.amt[nw]=it.amt[old];delete it.amt[old]}}rerenderSettings();return}
  if(d.cb){set(cfgDraft,d.cb,el.checked);return}
  if(d.ip){const[ii,pid]=d.ip.split('|'),it=cfgDraft.items[+ii];it.programs=it.programs||[];if(el.checked){if(!it.programs.includes(pid))it.programs.push(pid)}else it.programs=it.programs.filter(x=>x!==pid);return}
});
boot();
</script>
